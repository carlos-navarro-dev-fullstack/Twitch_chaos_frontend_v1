<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512">
      <stop stop-color="#7C3AED"></stop>
      <stop offset="1" stop-color="#EC4899"></stop>
    </linearGradient>

    <linearGradient id="face" x1="120" y1="120" x2="390" y2="390">
      <stop stop-color="#111827"></stop>
      <stop offset="1" stop-color="#1F2937"></stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="18" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"></rect>

  <!-- GLOW -->
  <circle cx="256" cy="256" r="170" fill="#A855F7" opacity="0.22" filter="url(#glow)"></circle>

  <!-- FACE -->
  <rect x="110" y="120" width="292" height="220" rx="42" fill="url(#face)" stroke="rgba(255,255,255,0.15)" stroke-width="6"></rect>

  <!-- EYES -->
  <circle cx="200" cy="220" r="22" fill="#EC4899"></circle>
  <circle cx="312" cy="220" r="22" fill="#A855F7"></circle>

  <!-- MOUTH -->
  <path d="M190 290C210 315 235 328 256 328C277 328 302 315 322 290" stroke="white" stroke-width="14" stroke-linecap="round"></path>

  <!-- ANTENNAS -->
  <line x1="180" y1="120" x2="150" y2="70" stroke="white" stroke-width="10" stroke-linecap="round"></line>

  <line x1="332" y1="120" x2="362" y2="70" stroke="white" stroke-width="10" stroke-linecap="round"></line>

  <circle cx="150" cy="70" r="14" fill="#EC4899"></circle>
  <circle cx="362" cy="70" r="14" fill="#A855F7"></circle>

  <!-- TEXT -->
  <text x="256" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="white" letter-spacing="3">
    CHAOS
  </text>
</svg>